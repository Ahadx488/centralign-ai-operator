version: "1.0"
max_auto_approve_amount_inr: 100000

egress:
  allowed_domains:
    - "company.com"
  denied_domains:
    - "evil.com"
    - "attacker.com"
    - "exfiltrate.org"
  default_action: "REQUIRE_APPROVAL"

rules:
  - id: "spending_threshold_approval"
    description: "Any bill or expense entry exceeding ₹100,000 must pause for human manager approval before final submission."
    condition: "action.type == 'create_bill' and action.amount > 100000"
    effect: "REQUIRE_APPROVAL"
    approver_role: "finance_manager"

  - id: "prohibit_record_deletion"
    description: "Agents are strictly forbidden from deleting invoices, bills, or audit records."
    condition: "action.type in ['delete_bill', 'delete_invoice', 'purge_logs']"
    effect: "DENY"

  - id: "external_communication_approval"
    description: "Sending emails to external email domains requires explicit approval or is denied per egress policy."
    condition: "action.type in ['send_email', 'mail_send']"
    effect: "DYNAMIC"

  - id: "file_access_restriction"
    description: "File operations are strictly confined to the fileshare directory."
    condition: "action.type == 'read_file' and not action.path.startswith('./env/fileshare/data')"
    effect: "DENY"
