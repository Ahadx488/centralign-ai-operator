[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "centralign"
version = "0.1.0"
description = "CentrAlign AI - Autonomous AI Task Worker & Operator"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CentrAlign AI Team" }
]
dependencies = [
    "pydantic>=2.6.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "playwright>=1.41.0",
    "jinja2>=3.1.2",
    "httpx>=0.26.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "pypdf>=4.0.0",
    "fpdf2>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*", "pypdf", "pypdf.*", "fpdf2", "fpdf2.*"]
ignore_missing_imports = true
