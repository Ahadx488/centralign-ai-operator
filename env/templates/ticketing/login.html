{% extends "base.html" %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto;">
    <div class="card">
        <h2 style="font-size: 20px; font-weight: 600; margin-bottom: 8px;">Internal Service Desk & HR Login</h2>
        <p style="font-size: 13px; color: #64748b; margin-bottom: 20px;">Support tickets, employee onboarding, and operational requests.</p>

        <form action="/tickets/login" method="post" id="tickets-login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="operator" required data-testid="tickets-username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" value="tickets_pass123" required data-testid="tickets-password">
            </div>
            <button type="submit" class="btn" style="width: 100%;" id="tickets-submit-btn" data-testid="tickets-login-submit">Sign In to Service Desk</button>
        </form>

        <div style="margin-top: 16px; font-size: 12px; color: #64748b; background: #f1f5f9; padding: 10px; border-radius: 6px;">
            <strong>Demo Credentials:</strong><br>
            Username: <code>operator</code><br>
            Password: <code>tickets_pass123</code>
        </div>
    </div>
</div>
{% endblock %}
