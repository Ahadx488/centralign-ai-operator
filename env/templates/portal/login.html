{% extends "base.html" %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto;">
    <div class="card">
        <h2 style="font-size: 20px; font-weight: 600; margin-bottom: 8px;">SupplierConnect Portal Login</h2>
        <p style="font-size: 13px; color: #64748b; margin-bottom: 20px;">Access your vendor dashboard, statements, and invoices.</p>

        <form action="/portal/login" method="post" id="portal-login-form">
            <div class="form-group">
                <label for="email">Vendor Email Address</label>
                <input type="email" id="email" name="email" value="supplier@acme.com" required data-testid="portal-email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" value="portal_pass123" required data-testid="portal-password">
            </div>
            <button type="submit" class="btn" style="width: 100%;" id="portal-submit-btn" data-testid="portal-login-submit">Sign In to SupplierConnect</button>
        </form>

        <div style="margin-top: 16px; font-size: 12px; color: #64748b; background: #f1f5f9; padding: 10px; border-radius: 6px;">
            <strong>Demo Credentials:</strong><br>
            Email: <code>supplier@acme.com</code><br>
            Password: <code>portal_pass123</code>
        </div>
    </div>
</div>
{% endblock %}
