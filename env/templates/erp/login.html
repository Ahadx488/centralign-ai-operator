{% extends "base.html" %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto;">
    <div class="card">
        <h2 style="font-size: 20px; font-weight: 600; margin-bottom: 8px;">Acme ERP Internal Login</h2>
        <p style="font-size: 13px; color: #64748b; margin-bottom: 20px;">Accounts Payable & Financial Records System.</p>

        <form action="/erp/login" method="post" id="erp-login-form">
            <div class="form-group">
                <label for="username">ERP Username</label>
                <input type="text" id="username" name="username" value="admin" required data-testid="erp-username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" value="erp_pass123" required data-testid="erp-password">
            </div>
            <button type="submit" class="btn" style="width: 100%;" id="erp-submit-btn" data-testid="erp-login-submit">Sign In to Acme ERP</button>
        </form>

        <div style="margin-top: 16px; font-size: 12px; color: #64748b; background: #f1f5f9; padding: 10px; border-radius: 6px;">
            <strong>Demo Credentials:</strong><br>
            Username: <code>admin</code><br>
            Password: <code>erp_pass123</code>
        </div>
    </div>
</div>
{% endblock %}
